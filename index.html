<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Schiecchi Mecatrônica — em breve.">
    <title>Schiecchi Mecatrônica — Em breve</title>
    <style>
      :root { font-family: Arial, Helvetica, sans-serif; color: #142d3b; background: #ffffff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(90vw, 620px); text-align: center; padding: 2rem; }
      .logo { display: flex; align-items: center; justify-content: center; gap: 1.3rem; }
      .symbol { width: clamp(72px, 16vw, 112px); height: auto; flex: none; }
      .wordmark { text-align: left; }
      .name { display: block; font-size: clamp(1.8rem, 6vw, 3.25rem); font-weight: 800; letter-spacing: .065em; line-height: 1; }
      .field { display: block; margin-top: .48rem; color: #187d91; font-size: clamp(.8rem, 2.4vw, 1.18rem); font-weight: 700; letter-spacing: .32em; text-transform: uppercase; }
      p { margin: 3.25rem 0 0; color: #536976; font-size: 1rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
      @media (max-width: 460px) {
        .logo { flex-direction: column; gap: 1rem; }
        .wordmark { text-align: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" role="img" aria-label="Schiecchi Mecatrônica">
        <svg class="symbol" viewBox="0 0 112 112" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M56 5 100 30v52l-44 25L12 82V30L56 5Z" fill="none" stroke="#142d3b" stroke-width="7" stroke-linejoin="round"/>
          <path d="M29 75V38l27 26 27-26v37" fill="none" stroke="#187d91" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="56" cy="64" r="5" fill="#142d3b"/>
        </svg>
        <div class="wordmark">
          <span class="name">SCHIECCHI</span>
          <span class="field">Mecatrônica</span>
        </div>
      </div>
      <p>Em breve</p>
    </main>
  </body>
</html>
